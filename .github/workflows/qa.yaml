name: Quality Assurance

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990

      - name: Lint rules
        run: make core-lint-rules

      - name: Compile rules
        run: make core-rules

      - name: Check if rules are up-to-date
        run: git diff --exit-code

      - name: Test
        run: make core-test

      - name: Test (asan + ubsan)
        run: cd core && make test-asan

  binding-js:
    name: JS binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Compile rules
        run: make core-rules

      - name: Test
        run: make binding-js-test

  web:
    name: Web example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - name: Build JS binding
        run: make binding-js-build

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: examples/web

      # tsc + vite build: keeps a type error out of master, where it would
      # otherwise only surface in the Pages deploy
      - name: Typecheck and build web
        run: pnpm build
        working-directory: examples/web

  binding-swift:
    name: Swift binding
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990

      - name: Compile rules
        run: make core-rules

      - name: Test
        run: make binding-swift-test
