<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilex:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<main>
    <div class="text-col">
        <div class="text" id="text" data-placeholder="Вставьте или введите текст…"><span class="loading">Загружаю движок…</span></div>
    </div>
    <div class="cards-col">
        <div class="cards" id="cards"></div>
    </div>
</main>
<template id="card-template">
    <div class="card">
        <div class="card-title">
            <span class="card-name"></span>
            <span class="count" hidden></span>
        </div>
        <div class="card-hint"></div>
    </div>
</template>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
